plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maxhayim.retrodeck'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        applicationId 'com.maxhayim.retrodeck'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 3
        versionName '0.3.0'
    }

    // Release APKs must always carry the same key, or an update won't install over the old one.
    // The key lives outside the repo; SIGNING_PROPERTIES points at its properties file. Without it
    // (someone building from source) the debug key is used, which is fine for a personal build.
    def signingFile = System.getenv('SIGNING_PROPERTIES')
    signingConfigs {
        if (signingFile && file(signingFile).exists()) {
            release {
                def p = new Properties()
                file(signingFile).withInputStream { p.load(it) }
                storeFile file(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkDependencies true
        lintConfig file('lint.xml')
        abortOnError true
        // Only correctness problems stop the build; style warnings are in the report.
        warningsAsErrors false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation project(':branding')
    testImplementation 'junit:junit:4.13.2'
}
