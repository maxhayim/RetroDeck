plugins {
    id 'com.android.library'
}

android {
    namespace 'com.maxhayim.retrodeck.branding'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        // GIPHY search needs an API key. It's never committed: give it as giphy.apiKey in local.properties
        // or GIPHY_API_KEY in the environment. Without one, the search screen asks the user for theirs.
        buildConfigField 'String', 'GIPHY_API_KEY', '"' + giphyKey() + '"'
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        // ./gradlew :branding:testDebugUnitTest -Prender (optionally -Prender.size=1920x1080) writes branded PNGs.
        unitTests.all {
            if (project.hasProperty('render')) systemProperty 'render', 'true'
            if (project.hasProperty('render.size')) systemProperty 'render.size', project.property('render.size')
            systemProperty 'demo.dir', rootProject.file('docs/demo').path
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

static String cleanKey(Object k) {
    String s = k == null ? '' : k.toString().trim()
    return s ==~ /[A-Za-z0-9]{0,64}/ ? s : ''
}

String giphyKey() {
    Properties local = new Properties()
    File f = rootProject.file('local.properties')
    if (f.exists()) f.withInputStream { local.load(it) }
    return cleanKey(local.getProperty('giphy.apiKey') ?: System.getenv('GIPHY_API_KEY'))
}

dependencies {
    implementation project(':core')
    // SVG logos. AndroidSVG renders to a Canvas, runs on API 14+, and never executes scripts.
    implementation 'com.caverock:androidsvg-aar:1.4'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub on the JVM; tests use the real one.
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
